<!DOCTYPE html>
<html>
	<head>
		<title>FiveM Kid Friendly Mod | Server Load Screen</title>

		<link href='https://fonts.googleapis.com/css?family=Indie Flower|Comfortaa' rel='stylesheet' type='text/css'>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
		<link rel="stylesheet" href="./assets/scripts/main.css">

		<script src="./config.js"></script>
		<script src="./assets/scripts/main.js"></script>
	</head>
	<body>
		<div id="fullScreenBg">
			<div class="fullscreenVideo"></div>

			<audio class="music" loop>
				<source src="assets/bg/bg_music.mp3" type="audio/mpeg">
			</audio>

			<div class="static"></div>

			<div class="animatedWrapper">
				<div class="animated"></div>
				<div class="animated bg2"></div>
				<div class="animated bg3"></div>
			</div>
		</div>

		<div id="volumeIndicator">
			<a>
				<div class="indicatorContainer">
					<i class="on fa-solid fa-volume-high active"></i>
					<i class="off fa-solid fa-volume-xmark"></i>
				</div>
				<span class="control"><b>SPACEBAR</b></span>
			</a>
		</div>

		<div id="socials"></div>

		<div id="wrapper">
			<h1 id="header"><span class="text">Hello, <span class="player">Player</span></span> <span class="emoji">&#128512;</span></h1>
			<table class="container">
				<tr>
					<td>
						<nav></nav>
					</td>
					<td class="contentArea">
						<div class="content"></div>
						<div id="connecting">
							<progress max="100" min="0" value="0"></progress>
							<div class="text">You're currently joining <span class="serverAddress">UNKNOWN</span>, please wait<span class="loading"></span></div>
						</div>
					</td>
				</tr>
			</table>
		</div>
	</body>
</html>
